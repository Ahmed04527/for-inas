<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>For Inas</title>
<style>
:root{--sand:#f3e4c8;--panel:#3a2752ee;--gold:#e8b85a;--red:#d6243a;--teal:#6cc2b1;--muted:#b9a9cf}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;width:100%;overflow:hidden;background:#1d1129;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--sand);touch-action:none;overscroll-behavior:none;-webkit-user-select:none;user-select:none}
canvas{display:block;width:100%!important;height:100%!important}
#hud{position:fixed;top:0;left:0;right:0;padding:calc(8px + env(safe-area-inset-top)) clamp(8px,3vw,16px) 0;display:flex;justify-content:space-between;align-items:center;gap:8px;pointer-events:none;font-size:clamp(.72rem,2.6vw,.95rem)}
#hud button{pointer-events:auto;background:none;border:0;color:var(--muted);text-decoration:underline;font:inherit;cursor:pointer;padding:6px 4px;white-space:nowrap}
#info{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
#hint{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:#00000066;padding:8px 16px;border-radius:20px;font-size:clamp(.72rem,2.5vw,.85rem);color:var(--gold);display:none;pointer-events:none;max-width:92vw;text-align:center}
body{position:relative}
body::after{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 45%,#180d2299 100%);z-index:2}
#panel,#final{position:fixed;left:50%;transform:translateX(-50%);width:min(560px,94vw);background:var(--panel);border-radius:16px;padding:clamp(14px,3.5vw,20px) clamp(14px,4vw,22px);line-height:1.6;border-left:4px solid var(--gold);font-size:clamp(.88rem,2.4vw,1rem)}
#panel{bottom:calc(14px + env(safe-area-inset-bottom));display:none;max-height:60vh;overflow:auto}
#final{top:50%;transform:translate(-50%,-50%);display:none;max-height:88vh;overflow:auto}
#panel a,#final a{color:var(--teal);font-weight:600}
h2{margin:0 0 8px;font-size:clamp(1.1rem,3.6vw,1.4rem)}
.btn{display:block;width:100%;margin-top:10px;background:var(--red);color:#fff;border:0;border-radius:10px;padding:13px 18px;font:inherit;font-weight:600;cursor:pointer;text-align:left;min-height:44px}
.btn.c{background:#4b3468;border:2px solid #6b5488;color:var(--sand)}
.btn.c:hover{border-color:var(--gold)}
.btn.s{display:inline-block;width:auto;padding:10px 18px}
#intro{position:fixed;inset:0;background:#1d1129f2;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:clamp(16px,5vw,24px);overflow-y:auto}
#intro h1{font-size:clamp(1.9rem,8vw,3.6rem);margin:0 0 12px}
#intro p{max-width:46ch;margin:0 0 10px;font-size:clamp(.85rem,2.6vw,1rem)}
#intro .btn{width:auto;margin-top:12px}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
@media (max-height:480px){
  #intro{justify-content:flex-start;padding-top:calc(20px + env(safe-area-inset-top))}
  #intro h1{font-size:clamp(1.5rem,6vw,2.2rem);margin-bottom:6px}
  #intro p{margin-bottom:6px}
  #panel,#final{max-height:72vh}
}
@media (min-width:900px){
  #hud{font-size:1rem}
}
</style>
</head>

const $ = id => document.getElementById(id);
let hintT = null;

// ==== audio: one song, on repeat, for the whole experience (self-contained, no external service) ====
let soundOn = false;
const bgSong = $("bgSong");
bgSong.volume = .55;
function toggleSound(){
  soundOn = !soundOn;
  if(soundOn){
    bgSong.play().then(()=>{
      $("soundBtn").textContent = "🔇 Mute";
      if($("startSound")) $("startSound").textContent = "🔇 Mute";
    }).catch(()=>{
      soundOn = false;
      $("soundBtn").textContent = "🔈 Sound (tap again)";
      if($("startSound")) $("startSound").textContent = "🔈 Sound (tap again)";
    });
  } else {
    bgSong.pause();
    $("soundBtn").textContent = "🔈 Sound";
    if($("startSound")) $("startSound").textContent = "🔈 Turn on sound";
  }
}

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x180d22);
scene.fog = new THREE.Fog(0x2a0f1a, 20, 85);
const cam = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, .1, 200);
const ren = new THREE.WebGLRenderer({antialias:true});
ren.setPixelRatio(Math.min(devicePixelRatio,2));
ren.setSize(innerWidth, innerHeight);
document.body.prepend(ren.domElement);
function onResize(){ cam.aspect=innerWidth/innerHeight; cam.updateProjectionMatrix(); ren.setSize(innerWidth,innerHeight); }
addEventListener("resize",onResize);
addEventListener("orientationchange",()=>setTimeout(onResize,300));
if(window.visualViewport) visualViewport.addEventListener("resize",onResize);

scene.add(new THREE.HemisphereLight(0xffb3b3,0x241030,.85));
const moon = new THREE.DirectionalLight(0xffcf9e,.55); moon.position.set(10,30,10); scene.add(moon);
const warmGlow = new THREE.PointLight(0xd6243a,.5,120); warmGlow.position.set(0,20,-40); scene.add(warmGlow);

// sol et chemin
const ground = new THREE.Mesh(new THREE.PlaneGeometry(200,400), new THREE.MeshStandardMaterial({color:0x2a1a3c}));
ground.rotation.x = -Math.PI/2; ground.position.set(0,-.01,-SP*1.5); scene.add(ground);
const path = new THREE.Mesh(new THREE.BoxGeometry(4,.1,SP*3+20), new THREE.MeshStandardMaterial({color:0x5a4478}));
path.position.set(0,0,-SP*1.5); scene.add(path);

// étoiles
const sp = [];
for(let i=0;i<500;i++) sp.push((Math.random()-.5)*200, 15+Math.random()*50, -Math.random()*220+40);
const sg = new THREE.BufferGeometry(); sg.setAttribute("position", new THREE.Float32BufferAttribute(sp,3));
scene.add(new THREE.Points(sg, new THREE.PointsMaterial({color:0xffffff,size:.4})));

// pétales flottants, rouge/or, sur toute la traversée
const PN = 140, pbase = [], ppos = new Float32Array(PN*3);
for(let i=0;i<PN;i++) pbase.push([(Math.random()-.5)*26, 1+Math.random()*9, -Math.random()*(SP*3+16)+8, Math.random()*6]);
const pg = new THREE.BufferGeometry(); pg.setAttribute("position", new THREE.BufferAttribute(ppos,3));
const petals = new THREE.Points(pg, new THREE.PointsMaterial({color:0xe8546a,size:.45,transparent:true,opacity:.75}));
scene.add(petals);

function emojiSprite(e){
  const c = document.createElement("canvas"); c.width=c.height=128;
  const g = c.getContext("2d"); g.font="96px serif"; g.textAlign="center"; g.textBaseline="middle"; g.fillText(e,64,70);
  const s = new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c),transparent:true}));
  s.scale.set(2.2,2.2,1); return s;
}

// salles
const items = [];
ROOMS.forEach((r,i)=>{
  r.z = -i*SP; r.got = 0;
  const plat = new THREE.Mesh(new THREE.CylinderGeometry(11,11,.4,48), new THREE.MeshStandardMaterial({color:0x3a2752}));
  plat.position.set(0,-.2,r.z); scene.add(plat);
  const ring = new THREE.Mesh(new THREE.TorusGeometry(11,.15,8,64), new THREE.MeshBasicMaterial({color:r.col}));
  ring.rotation.x = Math.PI/2; ring.position.set(0,.05,r.z); scene.add(ring);
  const pl = new THREE.PointLight(r.col,1.2,30); pl.position.set(0,6,r.z); scene.add(pl);
  if(r.objs) r.objs.forEach((o,k)=>{
    const n = r.objs.length;
    const px = (k-(n-1)/2)*6;
    const pz = r.z - 3 + (n>1 && k%2===0 ? 2 : 0);
    const grp = new THREE.Group(); grp.position.set(px,1.8,pz);
    const orb = new THREE.Mesh(new THREE.SphereGeometry(.9,24,24), new THREE.MeshStandardMaterial({color:r.col,emissive:r.col,emissiveIntensity:.6,transparent:true,opacity:.55}));
    grp.add(orb); const s = emojiSprite(o.e); s.position.y=0; grp.add(s);
    scene.add(grp); items.push({grp,o,r,taken:false,phase:Math.random()*6});
  });
});
// phare final
const beacon = new THREE.Mesh(new THREE.CylinderGeometry(.3,.3,30,12), new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:.35}));
beacon.position.set(0,15,ROOMS[3].z-4); scene.add(beacon);
const heart = emojiSprite("❤️"); heart.scale.set(4,4,1); heart.position.set(0,4,ROOMS[3].z-4); scene.add(heart);

// ===== décors =====
const anim = [];
anim.push(t=>{pbase.forEach((b,i)=>{ppos[i*3]=b[0]+Math.sin(t*.3+b[3])*1.4; ppos[i*3+1]=1+((b[1]+t*.6+b[3])%9); ppos[i*3+2]=b[2]+Math.sin(t*.2+b[3]*2)*1.2});
 pg.attributes.position.needsUpdate = true; petals.rotation.y = t*.02});
const M = (c,e)=>new THREE.MeshStandardMaterial({color:c,emissive:c,emissiveIntensity:e||0,side:THREE.DoubleSide});
const put = (m,x,y,z)=>{m.position.set(x,y,z);scene.add(m);return m};
const mesh = (g,m)=>new THREE.Mesh(g,m);

// Salle 1 : mini stade, drapeaux du Wydad, enceintes, boule à facettes
(()=>{const z0 = ROOMS[0].z;
 [-1,1].forEach(s=>{
  put(mesh(new THREE.CylinderGeometry(.08,.08,7,8),M(0xcccccc)), s*9, 3.5, z0+6);
  put(mesh(new THREE.PlaneGeometry(2.4,1.4),M(0xd6243a,.5)), s*9+1.2, 6, z0+6);
  put(mesh(new THREE.PlaneGeometry(2.4,.5),M(0xffffff,.4)), s*9+1.2, 6, z0+6.02);
  put(mesh(new THREE.BoxGeometry(.2,3,.2),M(0xffffff,.3)), s*9.5, 1.5, z0-8.2);
  put(mesh(new THREE.BoxGeometry(.2,3,.2),M(0xffffff,.3)), s*9.5, 1.5, z0-1.8);
  put(mesh(new THREE.BoxGeometry(.2,.2,6.6),M(0xffffff,.3)), s*9.5, 3, z0-5);
  put(mesh(new THREE.SphereGeometry(.35,12,12),M(0xffffff,.2)), s*7.2, .35, z0-5);
  put(mesh(new THREE.BoxGeometry(1.4,2.6,1.4),M(0x1a1024)), s*9.5, 1.3, z0+2.5);
  [.6,1.8].forEach(y=>{const c = put(mesh(new THREE.CircleGeometry(.4,20),M(0x6cc2b1,.8)), s*9.5-s*.71, y, z0+2.5); c.rotation.y = s>0 ? -Math.PI/2 : Math.PI/2;
   anim.push(t=>{c.scale.setScalar(1+Math.sin(t*6+y)*.12)});});
 });
 put(mesh(new THREE.CylinderGeometry(.03,.03,12,6),M(0xcccccc)), 0, 15, z0);
 const disco = put(mesh(new THREE.IcosahedronGeometry(1.4,1),new THREE.MeshStandardMaterial({color:0xdddddd,metalness:1,roughness:.2,flatShading:true})), 0, 9, z0);
 const dl = new THREE.PointLight(0xffffff,1.5,25); dl.position.set(0,8,z0); scene.add(dl);
 anim.push(t=>{disco.rotation.y = t*.8; dl.color.setHSL((t*.1)%1,.8,.6)});
})();

// Salle 2 : piliers sombres, éclats flottants, arche brisée
(()=>{const z0 = ROOMS[1].z;
 for(let k=0;k<10;k++){const a = k/10*Math.PI*2, x = Math.sin(a)*10, z = z0+Math.cos(a)*10, h = 9-(k%3)*2.5;
  if(Math.abs(x)<3.5) continue;
  put(mesh(new THREE.BoxGeometry(1.2,h,1.2),M(0x24102c)), x, h/2, z);
  put(mesh(new THREE.BoxGeometry(.15,h,1.3),M(0xd6243a,.9)), x, h/2, z);
 }
 for(let k=0;k<16;k++){const a = Math.random()*6.283, r = 3+Math.random()*7, y0 = 2+Math.random()*7, s = .3+Math.random()*.4;
  const sh = put(mesh(new THREE.OctahedronGeometry(s),M(0xd6243a,.7)), Math.sin(a)*r, y0, z0+Math.cos(a)*r);
  anim.push(t=>{sh.rotation.x = t*.6+k; sh.rotation.y = t*.4; sh.position.y = y0+Math.sin(t+k)*.4});}
 const arch = put(mesh(new THREE.TorusGeometry(6,.14,8,60,Math.PI*1.7),M(0xd6243a,.9)), 0, 6, z0-12);
 arch.rotation.z = -Math.PI*.35;
 anim.push(t=>{arch.material.emissiveIntensity = .6+Math.sin(t*2)*.3});

 // cadenas brisé au centre : la confiance trahie, puis promise de nouveau
 const lockGrp = new THREE.Group(); lockGrp.position.set(0,2.4,z0);
 const body_ = mesh(new THREE.BoxGeometry(1.6,1.3,.7), M(0x241028,.2)); lockGrp.add(body_);
 const shackleL = mesh(new THREE.TorusGeometry(.7,.14,10,30,Math.PI), M(0xe8b85a,.6)); shackleL.position.set(-.35,1.1,0); shackleL.rotation.z = .3; lockGrp.add(shackleL);
 const shackleR = mesh(new THREE.TorusGeometry(.7,.14,10,30,Math.PI), M(0xe8b85a,.6)); shackleR.position.set(.55,.95,0); shackleR.rotation.z = -.6; lockGrp.add(shackleR);
 const keyhole = mesh(new THREE.CircleGeometry(.18,16), M(0xd6243a,1)); keyhole.position.set(0,0,.36); lockGrp.add(keyhole);
 scene.add(lockGrp);
 const lockLight = new THREE.PointLight(0xd6243a,1,12); lockLight.position.set(0,3,z0+1); scene.add(lockLight);
 anim.push(t=>{lockGrp.rotation.y = t*.25; lockLight.intensity = 1+Math.sin(t*2.5)*.4});
})();

// Salle 3 : forêt lumineuse, mare, lucioles
(()=>{const z0 = ROOMS[2].z;
 const tree = (x,z,s)=>{
  put(mesh(new THREE.CylinderGeometry(.25*s,.35*s,2*s,6),M(0x4a3020)), x, s, z);
  put(mesh(new THREE.ConeGeometry(1.6*s,3*s,8),M(0x6cc2b1,.35)), x, 3.2*s, z);
  put(mesh(new THREE.ConeGeometry(1.2*s,2.4*s,8),M(0x8fe0cf,.5)), x, 4.8*s, z);};
 for(let k=0;k<12;k++){const a = k/12*Math.PI*2, x = Math.sin(a)*10.5, z = z0+Math.cos(a)*10.5;
  if(Math.abs(x)<3.5) continue; tree(x,z,.9+(k%3)*.25);}
 const pond = put(mesh(new THREE.CircleGeometry(3,32),M(0x3aa0c0,.5)), -6.5, .06, z0+4);
 pond.rotation.x = -Math.PI/2;
 const N = 60, base = [], pos = new Float32Array(N*3);
 for(let i=0;i<N;i++){const a = Math.random()*6.283, r = Math.random()*10;
  base.push([Math.sin(a)*r, 1+Math.random()*5, z0+Math.cos(a)*r, Math.random()*6]);}
 const g = new THREE.BufferGeometry(); g.setAttribute("position", new THREE.BufferAttribute(pos,3));
 scene.add(new THREE.Points(g,new THREE.PointsMaterial({color:0xfff2a0,size:.35,transparent:true,opacity:.9})));
 anim.push(t=>{base.forEach((b,i)=>{pos[i*3]=b[0]+Math.sin(t*.7+b[3])*.8; pos[i*3+1]=b[1]+Math.sin(t*1.2+b[3])*.5; pos[i*3+2]=b[2]+Math.cos(t*.6+b[3])*.8});
  g.attributes.position.needsUpdate = true});

 // pages qui s'envolent : dire enfin ce qu'on ressent, sans se cacher
 const pageMat = M(0xf3e4c8,.15);
 const pages = [];
 for(let i=0;i<9;i++){
  const p = mesh(new THREE.PlaneGeometry(.7,.9), pageMat);
  const a = Math.random()*6.283, r = 2+Math.random()*4;
  p.position.set(Math.sin(a)*r, 1.5+Math.random()*4, z0+4+Math.cos(a)*r*.6);
  scene.add(p); pages.push({p, ph:Math.random()*6, r0:r, a0:a, y0:p.position.y});
 }
 anim.push(t=>{pages.forEach(o=>{o.p.rotation.y = t*.6+o.ph; o.p.rotation.x = Math.sin(t+o.ph)*.4;
  o.p.position.y = o.y0 + Math.sin(t*.5+o.ph)*.5; o.p.position.x = Math.sin(o.a0+t*.15)*o.r0; })});

 // rayon de lumière qui monte, la croissance après la chute
 const beamMat = new THREE.MeshBasicMaterial({color:0x6cc2b1,transparent:true,opacity:.18});
 const beam = put(mesh(new THREE.CylinderGeometry(.4,1.6,14,20,1,true),beamMat), 0, 7, z0);
 anim.push(t=>{beam.rotation.y = t*.3; beamMat.opacity = .14+Math.sin(t*1.5)*.05});
})();

// Salle finale : arches dorées, lanternes qui montent, couronne de lumières, halo battant
(()=>{const z0 = ROOMS[3].z;
 for(let i=0;i<5;i++) put(mesh(new THREE.TorusGeometry(3.2,.1,8,40,Math.PI),M(0xe8b85a,.9)), 0, 0, z0+10-i*2.6);
 for(let k=0;k<28;k++){const pink = k%3===0, a = Math.random()*6.283, r = 3+Math.random()*9, y0 = Math.random()*14;
  const l = put(mesh(new THREE.SphereGeometry(.25,10,10),M(pink?0xff8fb0:0xffc46b,1.2)), Math.sin(a)*r, y0, z0+Math.cos(a)*r);
  anim.push(t=>{l.position.y = (y0+t*.8)%14; l.scale.setScalar(.8+Math.sin(t*3+k)*.2)});}
 for(let k=0;k<32;k++){const a = k/32*Math.PI*2;
  const b = put(mesh(new THREE.SphereGeometry(.18,8,8),M(0xffffff,1)), Math.sin(a)*10.5, .3, z0+Math.cos(a)*10.5);
  anim.push(t=>{b.scale.setScalar(1+Math.sin(t*3+k*.5)*.4)});}
 // halo qui bat comme un cœur, autour du ❤️
 const halo = put(mesh(new THREE.RingGeometry(2.2,2.4,48), new THREE.MeshBasicMaterial({color:0xff8fb0,transparent:true,opacity:.5,side:THREE.DoubleSide})), 0, 4, z0-4);
 anim.push(t=>{const pulse = 1+Math.abs(Math.sin(t*2.2))*.35; halo.scale.set(pulse,pulse,1); halo.material.opacity = .25+Math.abs(Math.sin(t*2.2))*.35});
})();

// joueur — silhouette féminine et élégante, faite de formes simples
const player = new THREE.Group();
const skin = new THREE.MeshStandardMaterial({color:0xd9a06b,roughness:.7});
const topMat = new THREE.MeshStandardMaterial({color:0xb5597a,roughness:.75});
const skirtMat = new THREE.MeshStandardMaterial({color:0x2a1a33,roughness:.85});
const hair = new THREE.MeshStandardMaterial({color:0x2a1810,roughness:.5});
const gold = new THREE.MeshStandardMaterial({color:0xe8b85a,roughness:.3,metalness:.4});

function capsule(mat,len,rad){
  const g = new THREE.Group();
  const cyl = new THREE.Mesh(new THREE.CylinderGeometry(rad,rad,len,10), mat);
  const top = new THREE.Mesh(new THREE.SphereGeometry(rad,10,8), mat); top.position.y = len/2;
  const bot = new THREE.Mesh(new THREE.SphereGeometry(rad,10,8), mat); bot.position.y = -len/2;
  g.add(cyl,top,bot); return g;
}
const hips = new THREE.Group(); hips.position.y = 1.0; player.add(hips);
const torso = capsule(topMat,.62,.3); torso.position.y = .58; hips.add(torso);
const skirtMesh = new THREE.Mesh(new THREE.ConeGeometry(.5,.5,14,1,true), skirtMat);
skirtMesh.position.y = .2; hips.add(skirtMesh);
const headGrp = new THREE.Group(); headGrp.position.y = 1.2; hips.add(headGrp);
const headMesh = new THREE.Mesh(new THREE.SphereGeometry(.29,20,20), skin); headGrp.add(headMesh);
const hairCap = new THREE.Mesh(new THREE.SphereGeometry(.305,20,12,0,Math.PI*2,0,Math.PI*.6), hair); hairCap.position.y=.03; headGrp.add(hairCap);
const ponytail = capsule(hair,.48,.065); ponytail.rotation.x = Math.PI*.2; ponytail.position.set(0,-.08,.27); headGrp.add(ponytail);
const earL = new THREE.Mesh(new THREE.SphereGeometry(.025,8,8),gold); earL.position.set(-.28,-.03,.05); headGrp.add(earL);
const earR = earL.clone(); earR.position.x = .28; headGrp.add(earR);

function limb(mat,len,rad){const g = capsule(mat,len,rad); g.position.y = -len/2-rad; const wrap = new THREE.Group(); wrap.add(g); return wrap;}
const armL = limb(skin,.54,.085); armL.position.set(-.34,.98,0); hips.add(armL);
const armR = limb(skin,.54,.085); armR.position.set(.34,.98,0); hips.add(armR);
const legL = limb(skin,.78,.11); legL.position.set(-.15,.02,0); hips.add(legL);
const legR = limb(skin,.78,.11); legR.position.set(.15,.02,0); hips.add(legR);

player.position.set(0,0,6); scene.add(player);

// état
let cur = 0, minZ = ROOMS[0].z - 14, running = false, ended = false, seen = {};
const keys = {}, joy = {x:0,y:0};
addEventListener("keydown",e=>{keys[e.key.toLowerCase()]=true});
addEventListener("keyup",e=>{keys[e.key.toLowerCase()]=false});
let t0 = null;
addEventListener("touchstart",e=>{if(e.target.closest("#panel,#final,#hud,#intro"))return;t0={x:e.touches[0].clientX,y:e.touches[0].clientY}},{passive:true});
addEventListener("touchmove",e=>{if(!t0)return;joy.x=Math.max(-1,Math.min(1,(e.touches[0].clientX-t0.x)/50));joy.y=Math.max(-1,Math.min(1,(e.touches[0].clientY-t0.y)/50))},{passive:true});
addEventListener("touchend",()=>{t0=null;joy.x=joy.y=0});

function panel(html, label){
  $("panel").innerHTML = html + `<button class="btn s" onclick="$('panel').style.display='none'">${label||"OK"}</button>`;
  $("panel").style.display = "block";
}
function updateInfo(){
  const total = items.length; const n = items.filter(i=>i.taken).length;
  $("info").textContent = ROOMS[cur].t + (total ? "  ·  memories " + n + "/" + total : "");
}
function checkRoom(){
  const r = ROOMS[cur];
  if(r.objs && r.got === r.objs.length && cur < 3){
    cur++; minZ = ROOMS[cur].z - 14; updateInfo();
    $("hint").textContent = "The path continues ahead ↓";
    $("hint").style.display = "block";
    clearTimeout(hintT); hintT = setTimeout(()=>{$("hint").style.display="none"},4000);
  }
}
function showFinal(){
  $("panel").style.display = "none";
  $("final").innerHTML = `<h2>${ROOMS[3].t}</h2><p>${FINAL_TEXT}</p>
  <p style="color:var(--muted)">No answer is wrong — choose whichever feels true for you</p>` +
  Object.keys(ANS).map(k=>`<button class="btn c" onclick="answer('${k}')">${ANS[k][0]}</button>`).join("");
  $("final").style.display = "block";
}
function answer(k){
  $("panel").style.display = "none";
  $("final").innerHTML = `<h2>Thank you, Inas</h2><p>${ANS[k][1]}</p><button class="btn c s" onclick="quit()">Close</button>`;
  $("final").style.display = "block";
}
function quit(){
  ended = true;
  $("panel").style.display = "none";
  bgSong.pause();
  $("final").innerHTML = `<h2>See you soon, or maybe not</h2><p>Thank you for stopping by — take care of yourself</p>`;
  $("final").style.display = "block";
}
$("start").onclick = ()=>{$("intro").style.display="none";running=true;updateInfo();
  panel("Here are the things that remind me of you — walk along the path and get close to the glowing orbs","Let's go")};

const clock = new THREE.Clock();
(function loop(){
  requestAnimationFrame(loop);
  const dt = Math.min(clock.getDelta(), .05), t = clock.elapsedTime;
  if(running && !ended){
    let ix = (keys.d||keys.arrowright?1:0)-(keys.a||keys.q||keys.arrowleft?1:0)+joy.x;
    let iz = (keys.s||keys.arrowdown?1:0)-(keys.w||keys.z||keys.arrowup?1:0)+joy.y;
    const m = Math.hypot(ix,iz);
    if(m>.1){ if(m>1){ix/=m;iz/=m}
      player.position.x = Math.max(-13, Math.min(13, player.position.x + ix*9*dt));
      player.position.z = Math.max(minZ, Math.min(9, player.position.z + iz*9*dt));
      player.rotation.y = Math.atan2(-ix,-iz);
      const w = t*10;
      legL.rotation.x = Math.sin(w)*.6; legR.rotation.x = -Math.sin(w)*.6;
      armL.rotation.x = -Math.sin(w)*.5; armR.rotation.x = Math.sin(w)*.5;
      hips.position.y = 1.0 + Math.abs(Math.sin(w))*.06;
      ponytail.rotation.z = Math.sin(w*.5)*.15;
    } else { legL.rotation.x*=.85; legR.rotation.x*=.85; armL.rotation.x*=.85; armR.rotation.x*=.85; }
    items.forEach(it=>{
      if(it.taken) return;
      if(player.position.distanceTo(new THREE.Vector3(it.grp.position.x,0,it.grp.position.z))<2.6){
        it.taken = true; it.r.got++; it.grp.visible = false;
        panel(it.o.x.replace("__PL__",PLAYLIST_URL).replace("__PHOTO__",PHOTO_B64)); updateInfo(); checkRoom();
      }
    });
    const r = ROOMS[cur];
    if(r.body && !seen[cur] && Math.abs(player.position.z - r.z) < 8){ seen[cur]=1; panel(r.body,"Continuer"); }
    if(!r.objs && !r.final && cur < 3 && player.position.z < r.z - 9){
      cur++; minZ = ROOMS[cur].z - 14; updateInfo();
      $("hint").textContent = "The path continues ahead ↓";
      $("hint").style.display = "block";
      clearTimeout(hintT); hintT = setTimeout(()=>{$("hint").style.display="none"},4000);
    }
    if(cur===3 && !seen[3] && player.position.z < ROOMS[3].z - 2){ seen[3]=1; showFinal(); }
  }
  items.forEach(it=>{it.grp.position.y = 1.8 + Math.sin(t*2+it.phase)*.3; it.grp.rotation.y = t});
  heart.scale.setScalar(4 + Math.sin(t*3)*.3);
  anim.forEach(f=>f(t));
  const target = new THREE.Vector3(player.position.x*.6, 7, player.position.z + 11);
  cam.position.lerp(target, .06);
  cam.lookAt(player.position.x*.8, 1.5, player.position.z - 4);
  ren.render(scene, cam);
})();
</script>
</body>
</html>
